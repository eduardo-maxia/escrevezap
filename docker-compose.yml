services:
  db:
    image: postgis/postgis:18-3.6-alpine
    volumes:
      - db-volume:/var/lib/postgresql
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust

  waha:
    # image: hsiereveld/waha-plus:latest # 2026.1.1
    # image: tanujempiricinfotech/waha-plus:latest # 2026.1.3
    image: contatomyvillage/waha-plus:gows # 2026.3.4
    ports:
      - 3003:3003
    env_file:
      - .env.waha
    volumes:
      - waha-media:/waha/media
    depends_on:
      - redis
      - db-waha
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    image: redis:7-alpine
    volumes:
      - redis-volume:/var/lib/redis/data

  db-waha:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: waha
      POSTGRES_USER: waha
      POSTGRES_PASSWORD: changeme
    volumes:
      - db-waha-volume:/var/lib/postgresql/data

volumes:
  db-waha-volume:
  redis-volume:
  waha-media:
  db-volume: