<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão — EscreveZap</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 40px; text-align: center; max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #111827; font-size: 20px; margin: 0 0 8px; }
    p  { color: #6b7280; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    a  { display: inline-block; background: #1E7A52; color: #fff; padding: 10px 22px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>Parece que você perdeu a conexão com a internet. Verifique sua rede e tente novamente.</p>
    <a href="/">Tentar novamente</a>
  </div>
</body>
</html>
